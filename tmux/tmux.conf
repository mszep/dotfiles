# remap prefix to Control + a
set -g prefix M-a
unbind-key C-b
bind-key C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1

# ensure session name in the bottom left is not truncated
set -g status-left-length 140

# Navigate between windows with Alt+Shift+[ and Alt+Shift+]
bind-key -n 'M-{' previous-window
bind-key -n 'M-}' next-window

# Move windows with Alt+Ctrl+[ and Alt+Ctrl+]
bind-key -n 'M-C-[' swap-window -t -1\; select-window -t -1
bind-key -n 'M-C-]' swap-window -t +1\; select-window -t +1

# Navigate between sessions with Cmd+Shift+[ and Cmd+Shift+]
# NB: tmux has no notion of the Cmd (Super) modifier, so Ghostty translates
# these chords into the Shift+Home / Shift+End escape codes; see
# ~/.config/ghostty/config (caveat: apps inside panes never see S-Home/S-End)
bind-key -n 'S-Home' switch-client -p
bind-key -n 'S-End' switch-client -n

# Split windows in current directory
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Session picker (mirrors nvim <C-f>)
# NB: this must run in a real window, not a popup: `tmux switch-client`
# executed from inside `popup -E` resolves the wrong client on tmux 3.6b
# and detaches the client instead of switching (observed 2026-10-06).
bind-key f new-window -n "sessionizer" "tmux-sessionizer"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin "arcticicestudio/nord-tmux"

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Install tpm if not yet present (i.e. on new machines)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
